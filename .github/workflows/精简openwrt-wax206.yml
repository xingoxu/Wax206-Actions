name: 精简流程版 可选wax206
run-name: 优化测试 - ${{ inputs.model || 'wax206'}}

on:
  workflow_dispatch:
    inputs:
      model:
        required: true
        description: Device Model
        type: choice
        default: gwax206
        options:
          - wax206      # 原版 32M
          - fmwax206    # 扩容 70M
          - gwax206     # 扩容 256M
          - gwax206_imm # 扩容 256M ImmortalWrt

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  WAX206_DIR: wax206
  DIY_SH: wax206/diy-part2.sh
  # 强制使用 Node.js 24，避免 Node.js 20 弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: 可用磁盘空间
        uses: sbwml/actions@free-disk
        with:
          build-mount-path: ${{ github.workspace }}

      - name: 构建系统设置
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dos2unix libfuse-dev ccache  # 新增: 安装 ccache
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E systemctl daemon-reload

      - name: 检出
        uses: actions/checkout@v4

      - name: 修复脚本执行权限
        run: |
          chmod +x wax206/build.sh
          chmod +x wax206/diy-part2.sh

      - name: 设置构建日期和时区
        run: |
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          echo "BUILD_DATE=$(date +"%y.%m.%d_%H.%M.%S")" >> $GITHUB_ENV

          CONF_FILE="./wax206/compilecfg/${{ inputs.model || 'wax206' }}.ini"

          if [ -f "$CONF_FILE" ]; then
            SRC_URL=$(grep "REPO_URL" "$CONF_FILE" | cut -d'=' -f2-)
            echo "BUILD_SRC=$SRC_URL" >> $GITHUB_ENV
          else
            echo "BUILD_SRC=Unknown" >> $GITHUB_ENV
            echo "::warning::配置文件 $CONF_FILE 不存在"
          fi

          # 设置 VARIANT 用于固件重命名
          case "${{ inputs.model || 'wax206' }}" in
            fmwax206) echo "VARIANT=70m" >> $GITHUB_ENV ;;
            gwax206|gwax206_imm) echo "VARIANT=256m" >> $GITHUB_ENV ;;
            *) echo "VARIANT=" >> $GITHUB_ENV ;;
          esac

      - name: 缓存依赖
        uses: actions/cache@v5.0.2
        with:
          path: |
            ./action_build/.ccache
            ./action_build/staging_dir
          key: ${{ matrix.os }}-${{ hashFiles('**/repo_flag') }}-${{ env.BUILD_DATE }}
          restore-keys: |
            ${{ matrix.os }}-${{ hashFiles('**/repo_flag') }}-

      - name: 刷新缓存
        run: |
          if [ -d "./action_build/staging_dir" ]; then
            echo "刷新 staging_dir 中的 stamp 文件时间戳..."
            # 使用 touch 刷新时间戳，保持缓存有效性（关键优化！）
            find "./action_build/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
              find "$dir" -type f -exec touch {} +
            done
            echo "stamp 文件时间戳刷新完成"
          else
            echo "staging_dir 目录不存在，跳过缓存刷新"
          fi

      - name: 构建固件
        run: |
          chmod +x $DIY_SH
          ./wax206/build.sh ${{ inputs.model || 'wax206'}}

      - name: 获取内核版本
        run: |
          KVER="Unknown"
          
          # 从 manifest 文件读取内核版本
          # manifest 文件格式: kernel - 6.18.33~12916f99c2c7a3cc8b861be165060899-r1
          echo "尝试从 manifest 文件获取内核版本..."
          # 查找所有 manifest 文件 (包括 Packages.manifest 等)
          MANIFEST_FILE=$(find ./firmware -name "*.manifest" -type f 2>/dev/null | head -1)
          if [ -n "$MANIFEST_FILE" ]; then
            echo "找到 manifest 文件: $MANIFEST_FILE"
            # 显示文件内容的前几行用于调试
            echo "manifest 文件内容预览:"
            head -5 "$MANIFEST_FILE" 2>/dev/null || echo "无法读取文件"
            # 提取内核版本
            KVER=$(grep "^kernel - " "$MANIFEST_FILE" 2>/dev/null | head -1 | sed -E 's/kernel - ([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/')
            if [ -n "$KVER" ]; then
              echo "从 manifest 文件获取到内核版本: $KVER"
            else
              echo "在 manifest 文件中未找到 kernel 行"
            fi
          else
            echo "未找到任何 manifest 文件"
            ls -la ./firmware/ 2>/dev/null || echo "firmware 目录不存在"
          fi
          
          if [ "$KVER" = "Unknown" ] || [ -z "$KVER" ]; then
            echo "::warning::未能获取到内核版本，使用默认值"
            KVER="Unknown"
          fi
          
          echo "KVER=$KVER" >> $GITHUB_ENV
          
          # 获取源码信息（从 action_build 目录）
          if [ -d "action_build" ]; then
            cd action_build
            useVersionInfo=$(git show -s --date=short --format="Author: %an<br/>date: %cd<br/>commit: %s<br/>commit hash: %H" 2>/dev/null || echo "Author: unknown<br/>date: unknown<br/>commit: unknown<br/>commit hash: unknown")
            echo "useVersionInfo=$useVersionInfo" >> $GITHUB_ENV
            cd ..
          else
            echo "::warning::源码目录 action_build 不存在"
            echo "useVersionInfo=Author: unknown<br/>date: unknown<br/>commit: unknown<br/>commit hash: unknown" >> $GITHUB_ENV
          fi
        continue-on-error: true

      - name: 删除旧缓存
        run: |
          gh cache list --key ${{ matrix.os }}-${{ hashFiles('**/repo_flag') }}- --json key --jq '.[] | .key' | while read -r key; do
            gh cache delete "$key"
          done
          echo "========cache status========"
          echo "ccache: $(du -sh ./action_build/.ccache | cut -f 1)"
          echo "staging: $(du -sh ./action_build/staging_dir | cut -f 1)"

      - name: 输出虚拟机信息
        run: |
          echo "=============================================="
          lscpu | grep -E "name|Core|Thread"
          echo "=============================================="
          df -h
          echo "=============================================="

      # ===== 精确版本重命名固件 =====
      - name: 重命名固件（区分版本）
        run: |
          cd firmware
          VARIANT="${{ env.VARIANT }}"

          case "$VARIANT" in
            70m)
              for f in *netgear_wax206*; do
                [ -f "$f" ] && mv "$f" "${f/netgear_wax206/netgear_wax206-70m}"
              done
              echo "已重命名为 70m 版本"
              ;;
            256m)
              for f in *netgear_wax206*; do
                [ -f "$f" ] && mv "$f" "${f/netgear_wax206/netgear_wax206-256m}"
              done
              echo "已重命名为 256m 版本"
              ;;
            *)
              echo "原版固件，保持默认名称"
              ;;
          esac

          echo "=== 最终固件列表 ==="
          ls -la *wax206* 2>/dev/null || true

      - name: 准备发布简介
        run: |
          VARIANT="${{ env.VARIANT }}"
          echo "测试精简文件版本" > release_body.txt
          echo "型号: ${{ inputs.model || 'wax206' }}${VARIANT:+ ($VARIANT)}" >> release_body.txt
          echo "源码：${{ env.BUILD_SRC }}" >> release_body.txt
          echo "Kernel: ${{ env.KVER }}" >> release_body.txt
          echo "SSID: Wax206" >> release_body.txt
          echo "LAN地址: 192.168.1.32" >> release_body.txt
          echo "源码最近提交信息:" >> release_body.txt
          echo "${{ env.useVersionInfo }}" >> release_body.txt
          echo "插件：" >> release_body.txt
          echo "$(grep -oP "luci-app(-[a-zA-Z0-9]{1,}){1,}" ./firmware/*.manifest 2>/dev/null | awk -F":" '{print $NF}' | xargs -d '\n' -n5 printf "%-25s  %-25s  %-25s  %-25s  %-25s\n")" >> release_body.txt

      - name: 删除不需要的固件文件
        run: |
          rm -f ./firmware/mt7622-ram-1ddr-bl2.bin
          rm -f ./firmware/mt7622-ram-2ddr-bl2.bin

      - name: 发布固件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_DATE }}_${{ inputs.model || 'wax206'}}
          files: ./firmware/*.*
          body_path: ./release_body.txt

      - name: 删除旧的工作流和固件
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: 优化测试wax206
          retain_days: 20
          keep_minimum_runs: 5

      - name: 删除旧的发布版本
        uses: codesnas/delete-older-releases@main
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 10
          delete_tag_pattern: ${{ inputs.model || 'wax206'}}
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
